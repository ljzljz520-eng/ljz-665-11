<!DOCTYPE html>
<html lang="zh_CN" id="htmlRoot">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="renderer" content="webkit" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,user-scalable=0"
    />

    <title><%= title %></title>
    <link rel="icon" href="<%= basePublicPath %>/logo.png" />
    <!-- 全局配置 -->
    <script>
      window._CONFIG = {};
    </script>
  </head>
  <body>
    <script>
      (() => {
        var htmlRoot = document.getElementById('htmlRoot');
        var theme = window.localStorage.getItem('__APP__DARK__MODE__');
        if (htmlRoot && theme) {
          htmlRoot.setAttribute('data-theme', theme);
          theme = htmlRoot = null;
        }
      })();
    </script>
    <div id="app">
      <style>
        html[data-theme='dark'] .app-loading {
          background-color: #2c344a;
        }

        html[data-theme='dark'] .app-loading .app-loading-title {
          color: rgba(255, 255, 255, 0.85);
        }

        .app-loading {
          display: flex;
          width: 100%;
          height: 100%;
          justify-content: center;
          align-items: center;
          flex-direction: column;
          background-color: #f4f7f9;
        }

        .app-loading .app-loading-wrap {
          position: absolute;
          top: 50%;
          left: 50%;
          display: flex;
          -webkit-transform: translate3d(-50%, -50%, 0);
          transform: translate3d(-50%, -50%, 0);
          justify-content: center;
          align-items: center;
          flex-direction: column;
        }

        .app-loading .dots {
          display: flex;
          padding: 98px;
          justify-content: center;
          align-items: center;
        }

        .app-loading .app-loading-title {
          display: flex;
          margin-top: 30px;
          font-size: 30px;
          color: rgba(0, 0, 0, 0.85);
          justify-content: center;
          align-items: center;
        }

        .app-loading .app-loading-logo {
          display: block;
          width: 90px;
          margin: 0 auto;
          margin-bottom: 20px;
        }

        .dot {
          position: relative;
          display: inline-block;
          width: 48px;
          height: 48px;
          margin-top: 30px;
          font-size: 32px;
          transform: rotate(45deg);
          box-sizing: border-box;
          animation: antRotate 1.2s infinite linear;
        }

        .dot i {
          position: absolute;
          display: block;
          width: 20px;
          height: 20px;
          background-color: #0065cc;
          border-radius: 100%;
          opacity: 0.3;
          transform: scale(0.75);
          animation: antSpinMove 1s infinite linear alternate;
          transform-origin: 50% 50%;
        }

        .dot i:nth-child(1) {
          top: 0;
          left: 0;
        }

        .dot i:nth-child(2) {
          top: 0;
          right: 0;
          -webkit-animation-delay: 0.4s;
          animation-delay: 0.4s;
        }

        .dot i:nth-child(3) {
          right: 0;
          bottom: 0;
          -webkit-animation-delay: 0.8s;
          animation-delay: 0.8s;
        }

        .dot i:nth-child(4) {
          bottom: 0;
          left: 0;
          -webkit-animation-delay: 1.2s;
          animation-delay: 1.2s;
        }
        @keyframes antRotate {
          to {
            -webkit-transform: rotate(405deg);
            transform: rotate(405deg);
          }
        }
        @-webkit-keyframes antRotate {
          to {
            -webkit-transform: rotate(405deg);
            transform: rotate(405deg);
          }
        }
        @keyframes antSpinMove {
          to {
            opacity: 1;
          }
        }
        @-webkit-keyframes antSpinMove {
          to {
            opacity: 1;
          }
        }
      </style>
      <div class="app-loading">
        <div class="app-loading-wrap">
          <img src="<%= basePublicPath %>/resource/img/logo.png" class="app-loading-logo" alt="Logo" />
          <div class="app-loading-dots">
            <span class="dot dot-spin"><i></i><i></i><i></i><i></i></span>
          </div>
          <div class="app-loading-title"><%= title %></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
    <!-- 启动看门狗：应用长时间停留在加载页（常见于后端不可用/数据库连接失败）时，给出可见的错误提示与排查指引，避免“白屏”无反馈 -->
    <script>
      (function () {
        var BOOT_TIMEOUT_MS = 20000;
        // 与 nginx.conf / vite 代理保持一致的后端前缀
        var HEALTH_URL = '/jeecgboot/actuator/health';

        function checkBackendHealth() {
          return fetch(HEALTH_URL, { cache: 'no-store' })
            .then(function (resp) {
              return resp
                .json()
                .catch(function () {
                  return null;
                })
                .then(function (body) {
                  if (body && body.status) {
                    return { reachable: true, text: body.status + '（HTTP ' + resp.status + '）' };
                  }
                  return { reachable: true, text: 'HTTP ' + resp.status };
                });
            })
            .catch(function () {
              return { reachable: false, text: '无法连接（后端未启动或已崩溃）' };
            });
        }

        function renderBootError(health) {
          var app = document.getElementById('app');
          if (!app) return;
          var panel = document.createElement('div');
          panel.id = 'app-boot-error';
          panel.style.cssText =
            'max-width:640px;margin:12vh auto;padding:32px 36px;background:#fff;border:1px solid #ffccc7;' +
            'border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.08);font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;' +
            'color:rgba(0,0,0,.85);line-height:1.8';
          panel.innerHTML =
            '<h2 style="margin:0 0 12px;color:#cf1322;font-size:20px;">应用未能正常启动</h2>' +
            '<p style="margin:0 0 8px;">页面长时间停留在加载状态，通常是<b>后端服务不可用</b>（如数据库连接失败导致后端退出）引起的。</p>' +
            '<p style="margin:0 0 8px;">后端健康检查（<code>' + HEALTH_URL + '</code>）：<b style="color:#cf1322;">' + health.text + '</b></p>' +
            '<div style="margin:16px 0;padding:12px 16px;background:#f5f5f5;border-radius:4px;font-size:13px;">' +
            '<b>排查建议：</b><br/>' +
            '1. 执行 <code>docker compose ps</code> 确认 backend / db 容器状态；<br/>' +
            '2. 执行 <code>docker logs jeecg-backend --tail 100</code> 查看是否有 [DB-CHECK] 报错；<br/>' +
            '3. 确认 SQL Server 连接配置（库名 temp1218、端口 1433、账号密码，见 README「SQL Server 连接配置」）。' +
            '</div>' +
            '<button onclick="location.reload()" style="padding:6px 24px;background:#0065cc;color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:14px;">重新加载</button>';
          app.innerHTML = '';
          app.appendChild(panel);
        }

        setTimeout(function () {
          // Vue 挂载成功后会替换 #app 内的加载动画；加载动画仍在说明启动被卡住
          if (!document.querySelector('#app .app-loading')) return;
          checkBackendHealth().then(renderBootError);
        }, BOOT_TIMEOUT_MS);
      })();
    </script>
    <!-- 百度统计 -->
    <script>
      var _hmt = _hmt || [];

        hm.src = "https://hm.baidu.com/hm.js?0febd9e3cacb3f627ddac64d52caac39";

  </body>
</html>
